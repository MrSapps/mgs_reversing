options:
  platform:     psx
  basename:     sound.bin
  base_path:    .
  target_path:  SLPM86247/stage/sound.bin
  asm_path:     asm/sound.bin
  asset_path:   assets/sound.bin
  src_path:     src/sound.bin
  asm_endlabels: yes
  # compiler
  compiler: "IDO"
  # disasm/linker
  symbol_addrs_path:    symbol_addrs.sound.bin.txt
  undefined_syms_path:  undefined_syms.sound.bin.txt
  undefined_funcs_auto_path:  undefined_funcs_auto.sound.bin.txt
  undefined_syms_auto_path:   undefined_syms_auto.sound.bin.txt
  find_file_boundaries: yes
  use_legacy_include_asm: False
  use_function_labels: no
  migrate_rodata_to_functions: no
segments:
  - name: main
    type: code
    start: 0x00000000
    vram:  0x800C3208
    subalign: 4
    subsegments:
      - [0x0, data, gcl_table]
      - [0x10, asm, text]
      - [0x434, data]
  - [0x469] # eof
